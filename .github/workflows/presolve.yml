# Presolve: solves the next flops of the solver chart packs (src/presolve/scenarios.ts) with our own solver. The app's
# packs go to the `packs-data` branch (a data-only orphan branch the app reads through jsDelivr pinned to a commit, with
# raw.githubusercontent.com as the fallback; docs/solver-packs.md "Data branch"), and public/packs/data.json on master
# points at its newest commit. The calibration packs (CAL_SCENARIOS) go to calibration/packs/ on master, a v1 manifest
# outside public/ that the app never lists or deploys (scripts/fit-realization.mjs reads it). Flops already published
# for a pack's version are skipped, so every run continues where the last one stopped, in priority order.
#
# The repository is public, so GitHub-hosted standard Linux runners are free with unlimited minutes: 4 vCPU,
# 16 GB, up to 6 h per job, up to 20 jobs at once for the whole account (so `shards` stops at 16). Each run fans
# out into `shards` parallel "solve" jobs (default 16). Job i solves the flops whose index k in the priority
# order has k % shards == i (scripts/presolve.mjs --shard i/n), one flop per core (~2–16 core-minutes and up
# to ~2 GB each), until its budget (default 300 min) runs out, and uploads only the flop files it added and their exact
# summaries. The "merge" job copies those files in (scripts/packs-ingest.mjs), rebuilds the manifests
# (--rebuild-manifest), pushes ONE commit to packs-data ("Packs: N new flops") and then ONE commit to master
# ("Presolve: N new flops": the calibration packs and data.json), so a run costs one deploy. Shards that finished are
# kept when another shard fails or times out. Every job works on the master and packs-data heads that the "plan" job
# reads once the run starts (after the concurrency wait), not on github.sha, which is fixed when the run is queued: a
# run that waited behind another one then starts from that run's commits instead of re-solving its flops.
#
# Nothing downloads the app's flop files: every checkout of packs-data is shallow, blobless and sparse (the catalog and
# the per-pack indexes, about 0.6 MB a pack), so the shards know what is published from the indexes and the merge adds
# only the new files. When packs-data is missing or the plan job cannot check it out, the run solves the calibration
# packs only (--set calibration) instead of failing, so a data-branch problem never stalls the calibration queue. Master is checked out shallow in the shards (PRESOLVE_SOLVER_COMMIT, read once by the plan job from
# a blobless full history, names the solver commit) and blobless in the merge, so old pack blobs are never fetched.
#
# Schedule: a run that pushed new flops starts the next run itself while flops are left ("Start the next run"
# at the end), so the runs follow each other back to back until every pack is full; a run still going makes the
# next one wait (concurrency below). The 6-hourly schedule is the backstop: GitHub sometimes never starts a
# scheduled run, and a run that solved nothing does not start another. A run with work takes ~5 h 15 min (setup,
# 300 min of solving, merge). One run gives 16 × 4 cores × ~290 min of solving. With nothing left, a run ends within
# minutes.
#
# Order (each pack's `queue`, lowest first; packs with the same value are interleaved): the app queue first (its
# solver-chart packs: the single raised pots against the BB at 55 and 35bb at −3, the 3-bet pots at −2, everything at
# 100bb at −1; about 14.4 runs, 3.2 days, docs/solver-packs.md "The app queue"), then the app's first three packs and the
# two short-stage calibration packs at 0 (complete), then the calibration queue 1–41 (about 77 runs, 16.7 days; 16-bit
# storage, slim files of about 2 KB).
#
# A push to master that changes a pack definition (scenarios.ts or the pinned ranges) starts a run at once,
# instead of waiting up to 6 hours for the schedule; it solves only what is missing, like any other run.
# GitHub's terms ask that Actions serve the project: these packs are the app's own data, and the total work is
# fixed by the packs (the schedule only decides how soon it is done), so the runners sit idle once they are full.
name: Presolve

on:
  push:
    branches: [master]
    paths:
      - src/presolve/scenarios.ts
      - src/presolve/calRanges.ts
      - src/presolve/appRanges.ts
  schedule:
    # 05:23, 11:23, 17:23 and 23:23 UTC (14:23, 20:23, 02:23, 08:23 KST): all outside the busy 6–9 AM Pacific
    # window, when scheduled runs often start hours late.
    - cron: "23 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      scenario:
        description: "Pack id (src/presolve/scenarios.ts) or all"
        default: all
        type: string
      shards:
        description: "Parallel solve jobs (1–16; the account's 20 concurrent jobs are shared with other workflows)"
        default: "16"
        type: string
      budget_minutes:
        description: "Solving budget per job in minutes (at most 320; the script stops cleanly before it)"
        default: "300"
        type: string
      count:
        description: "Cover the first N flops of the priority order per pack (1755 = all)"
        default: "1755"
        type: string

# Read-only by default; only the merge job pushes.
permissions:
  contents: read

# Never two runs at once: they would solve the same flops and race on the manifest.
concurrency:
  group: presolve
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      n: ${{ steps.plan.outputs.n }}
      sha: ${{ steps.head.outputs.sha }}
      # Empty when the run solves the calibration packs only (no usable packs-data); `set` is then "calibration".
      data_sha: ${{ steps.data.outputs.data_sha }}
      set: ${{ steps.data.outputs.set }}
      solver_commit: ${{ steps.head.outputs.solver_commit }}
    steps:
      - id: plan
        env:
          SHARDS: ${{ inputs.shards || '16' }}
        run: |
          if [ "$GITHUB_REF_TYPE" != branch ]; then
            echo "::error::Run this workflow on a branch (the merge pushes to it), not on $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi
          if ! [[ "$SHARDS" =~ ^[1-9][0-9]*$ ]] || (( SHARDS > 16 )); then
            echo "::error::shards must be a whole number from 1 to 16, got '$SHARDS'"
            exit 1
          fi
          echo "n=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "shards=[$(seq -s, 0 $((SHARDS - 1)))]" >> "$GITHUB_OUTPUT"

      # The branch head as it is now, after the concurrency wait (a `ref` without a SHA makes checkout fetch the
      # branch, not github.sha, which was fixed when the run was queued). Every later job checks out this commit.
      # Full history without blobs, src/solver only: enough to name the solver's last commit for every job.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: src/solver

      - id: head
        run: |
          sha=$(git rev-parse HEAD)
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not read the head of ${GITHUB_REF_NAME} (got '$sha')"
            exit 1
          fi
          solver=$(git log -1 --format=%h -- src/solver ':!*.test.ts')
          if ! [[ "$solver" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Could not read the last commit of src/solver (got '$solver')"
            exit 1
          fi
          data=$(git ls-remote origin refs/heads/packs-data | cut -f1)
          if ! [[ "$data" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::No packs-data branch (got '$data'): solving the calibration packs only. Push it first (docs/solver-packs.md, Data branch)."
            data=""
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "solver_commit=$solver" >> "$GITHUB_OUTPUT"
          echo "data_head=$data" >> "$GITHUB_OUTPUT"
          echo "Solving from ${GITHUB_REF_NAME} at $sha (github.sha $GITHUB_SHA), packs-data at ${data:-none}, solver $solver"

      # The same checkout of packs-data as the solve and merge jobs make (sparse at a SHA: catalog and indexes). If it
      # fails here, every shard would fail the same way: the run solves the calibration packs only instead.
      - name: Check out packs-data (catalog and indexes)
        id: datacheck
        if: ${{ steps.head.outputs.data_head != '' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.head.outputs.data_head }}
          path: packs-data
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            packs/manifest.json
            packs/*/v*/index-*.json
          sparse-checkout-cone-mode: false

      - id: data
        env:
          DATA_HEAD: ${{ steps.head.outputs.data_head }}
          CHECKOUT: ${{ steps.datacheck.outcome }}
        run: |
          if [ -n "$DATA_HEAD" ] && [ "$CHECKOUT" = success ] && [ -f packs-data/packs/manifest.json ]; then
            echo "data_sha=$DATA_HEAD" >> "$GITHUB_OUTPUT"
            echo "set=" >> "$GITHUB_OUTPUT"
            echo "Solving every pack; packs-data at $DATA_HEAD"
          else
            if [ -n "$DATA_HEAD" ]; then
              echo "::warning::Could not check out packs-data at $DATA_HEAD (or it has no packs/manifest.json): solving the calibration packs only"
            fi
            echo "data_sha=" >> "$GITHUB_OUTPUT"
            echo "set=calibration" >> "$GITHUB_OUTPUT"
          fi

  solve:
    needs: plan
    runs-on: ubuntu-latest
    # The script stops on its own before its budget (at most 320 min); the step timeout below only guards
    # against a hang and still leaves time to upload. Setup included, this stays under GitHub's 6-hour limit.
    timeout-minutes: 350
    strategy:
      fail-fast: false # a failing shard must not cancel the others
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }} # the same commit in every shard and in merge
          fetch-depth: 1 # PRESOLVE_SOLVER_COMMIT names the solver commit; no history walk

      # The data branch at the plan's commit: the catalog and the per-pack indexes (what is published), no flop files.
      - uses: actions/checkout@v4
        if: ${{ needs.plan.outputs.data_sha != '' }}
        with:
          ref: ${{ needs.plan.outputs.data_sha }}
          path: packs-data
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            packs/manifest.json
            packs/*/v*/index-*.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Solve shard ${{ matrix.shard }}/${{ needs.plan.outputs.n }}
        id: presolve
        timeout-minutes: 330
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.n }}
          SCENARIO: ${{ inputs.scenario || 'all' }}
          BUDGET: ${{ inputs.budget_minutes || '300' }}
          COUNT: ${{ inputs.count || '1755' }}
          PRESOLVE_SOLVER_COMMIT: ${{ needs.plan.outputs.solver_commit }}
          SET: ${{ needs.plan.outputs.set }}
        run: |
          if ! [[ "$BUDGET" =~ ^[0-9]+$ ]] || (( 10#$BUDGET < 1 )); then
            echo "::error::budget_minutes must be a whole number of minutes, got '$BUDGET'"
            exit 1
          fi
          if (( 10#$BUDGET > 320 )); then
            echo "::warning::budget_minutes $BUDGET is above 320; using 320 so the job ends before its timeout"
            BUDGET=320
          fi
          set_args=()
          if [ -n "$SET" ]; then set_args=(--set "$SET"); fi
          node scripts/presolve.mjs --scenario "$SCENARIO" "${set_args[@]}" --shard "$SHARD" --budget-minutes "$((10#$BUDGET))" \
            --count "$COUNT" --workers "$(nproc)" --summaries-out shard-summaries.json

      # Only the flop files this shard added (app packs under files/, calibration packs under cal-files/), plus
      # their exact summaries (summaries.json; the merge job rebuilds the manifests and reads only these from it).
      # Also runs when solving failed or timed out: every file on disk was written whole (temp file + rename) after
      # passing the write checks. Every flop file in packs-data/ is new: its checkout has none.
      - name: Collect new flops
        if: ${{ always() && steps.presolve.outcome != 'skipped' }}
        run: |
          mkdir -p shard-out/files shard-out/cal-files
          : > new-app-flops.txt
          if [ -d packs-data/packs ]; then
            find packs-data/packs -type f -regextype posix-extended -regex '.*/[a-z0-9-]+/v[0-9]+/flop-[2-9TJQKAshdc]{6}\.json' \
              | sed 's|^packs-data/packs/||' | sort > new-app-flops.txt
          fi
          git ls-files --others --exclude-standard -- calibration/packs \
            | grep -E "^calibration/packs/[a-z0-9-]+/v[0-9]+/flop-[2-9TJQKAshdc]{6}\.json$" | sed 's|^calibration/packs/||' > new-cal-flops.txt || true
          for set in "packs-data/packs:files:new-app-flops.txt" "calibration/packs:cal-files:new-cal-flops.txt"; do
            IFS=: read -r dir out list <<< "$set"
            while IFS= read -r rel; do
              mkdir -p "shard-out/$out/$(dirname "$rel")"
              cp "$dir/$rel" "shard-out/$out/$rel"
            done < "$list"
          done
          if [ -f shard-summaries.json ]; then cp shard-summaries.json shard-out/summaries.json; fi
          echo "$(wc -l < new-app-flops.txt) app and $(wc -l < new-cal-flops.txt) calibration flop file(s) in shard ${{ matrix.shard }}"

      - name: Upload new flops
        if: ${{ always() && steps.presolve.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: shard-out/
          retention-days: 2
          if-no-files-found: ignore

      # After the upload, so the good flops of the shard are kept. A flop above the exploitability limit is never
      # written and would be retried every day: raise the scenario's iterations and bump its version.
      - name: Fail on solve errors
        if: ${{ (steps.presolve.outputs.failed != '' && steps.presolve.outputs.failed != '0') || (steps.presolve.outputs.rejected != '' && steps.presolve.outputs.rejected != '0') }}
        env:
          FAILED: ${{ steps.presolve.outputs.failed || '0' }}
          REJECTED: ${{ steps.presolve.outputs.rejected || '0' }}
        run: |
          echo "${FAILED} failure(s), ${REJECTED} flop(s) above the exploitability limit; see the Solve step."
          exit 1

  merge:
    needs: [plan, solve]
    # Also after a failed or timed-out shard, so the shards that finished are kept; not when the run is cancelled.
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write # "Start the next run" below
    env:
      PRESOLVE_SOLVER_COMMIT: ${{ needs.plan.outputs.solver_commit }}
      SCENARIO: ${{ inputs.scenario || 'all' }}
      SET: ${{ needs.plan.outputs.set }}
    steps:
      # The commit the shards solved from (detached), so the manifests' checks match their files; the push below
      # rebases onto anything pushed to the branch in the meantime. Blobless: the history without old pack blobs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          filter: blob:none

      - uses: actions/checkout@v4
        if: ${{ needs.plan.outputs.data_sha != '' }}
        with:
          ref: ${{ needs.plan.outputs.data_sha }}
          path: packs-data
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            packs/manifest.json
            packs/*/v*/index-*.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          # one folder per shard: shards/shard-<i>/files/<pack>/v<k>/flop-*.json (app packs),
          # shards/shard-<i>/cal-files/<pack>/v<k>/flop-*.json (calibration packs) and shards/shard-<i>/summaries.json
          path: shards

      - name: Configure git
        run: |
          for repo in . packs-data; do
            if [ ! -d "$repo/.git" ]; then continue; fi
            git -C "$repo" config user.name "github-actions[bot]"
            git -C "$repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          done

      # Copies the new files in (a published or existing file is never replaced), then rebuilds both manifests with the
      # same checks as before writing a solved flop; on a failure it exits 1 and nothing is committed (the shard
      # artifacts stay for 2 days). Unchanged apart from generatedAt → not rewritten, no commit.
      - name: Copy the shards' flops and rebuild the manifests
        id: copy
        run: |
          node scripts/packs-ingest.mjs --shards shards
          hints=()
          for f in shards/*/summaries.json; do
            if [ -f "$f" ]; then hints+=(--summaries-from "$f"); fi
          done
          set_args=()
          if [ -n "$SET" ]; then set_args=(--set "$SET"); fi
          node scripts/presolve.mjs --rebuild-manifest --scenario "$SCENARIO" "${set_args[@]}" "${hints[@]}"

      # The app's packs: one commit on packs-data. A rejected push (the branch moved) is redone on the new head: reset to
      # it, copy the shards' files in again and rebuild (indexes are content-addressed and flop files never change, so
      # redoing on top is always safe). Ends with packs-data at the branch's head, so data.json names the newest commit.
      - name: Push the app's packs to packs-data
        id: data
        if: ${{ needs.plan.outputs.data_sha != '' }}
        run: |
          hints=()
          for f in shards/*/summaries.json; do
            if [ -f "$f" ]; then hints+=(--summaries-from "$f"); fi
          done
          cd packs-data
          for attempt in 1 2 3 4 5; do
            git add --sparse -A packs
            if git diff --cached --quiet; then
              # Nothing of ours to add: move to the branch's head (another run may have pushed since the plan).
              git fetch --depth 1 --filter=blob:none origin packs-data
              if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then git reset --quiet --hard FETCH_HEAD; fi
              echo "No new app flops for packs-data."
              break
            fi
            n=$(git diff --cached --name-only --diff-filter=A -- packs | grep -cE '/flop-[^/]+\.json$' || true)
            git commit --quiet -m "Packs: ${n} new flops"
            if git push origin "HEAD:refs/heads/packs-data"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "Pushed ${n} new app flops to packs-data at $(git rev-parse HEAD)"
              break
            fi
            if (( attempt == 5 )); then
              echo "Could not push to packs-data after 5 attempts."
              exit 1
            fi
            echo "Push to packs-data failed (attempt $attempt); redoing on the branch's new head..."
            sleep $((attempt * 5))
            git fetch --depth 1 --filter=blob:none origin packs-data
            # Our flop files sit outside the sparse patterns: remove them first (packs-ingest copies them in again),
            # else the reset refuses to drop them ("not uptodate").
            git diff --name-only --diff-filter=A HEAD^ HEAD -- packs | grep -E '/flop-[^/]+\.json$' | xargs -r rm -f
            git reset --quiet --hard FETCH_HEAD
            (cd .. && node scripts/packs-ingest.mjs --shards shards && node scripts/presolve.mjs --rebuild-manifest --scenario "$SCENARIO" --set app "${hints[@]}")
          done
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Commit new flops
        id: commit
        env:
          NEW_FLOPS: ${{ steps.copy.outputs.new_flops || '0' }}
          DATA_COMMIT: ${{ steps.data.outputs.commit }}
          DATA_PUSHED: ${{ steps.data.outputs.pushed || 'false' }}
        run: |
          if [ "$DATA_PUSHED" = true ]; then echo "pushed=true" >> "$GITHUB_OUTPUT"; fi
          # >>> point_data (scratch simulations extract this function from here)
          # data.json names packs-data's head: the branch only moves forward (every push lands on its head), so the head
          # holds this run's commit and anything a later run pushed. Nothing to point at in a calibration-only run.
          point_data() {
            if [ -z "$DATA_COMMIT" ]; then return 0; fi
            local head
            head=$(git -C packs-data ls-remote origin refs/heads/packs-data | cut -f1)
            if [[ "$head" =~ ^[0-9a-f]{40}$ ]] && [ "$head" != "$DATA_COMMIT" ]; then
              git -C packs-data fetch --quiet --depth 1 --filter=blob:none origin packs-data
              head=$(git -C packs-data rev-parse FETCH_HEAD)
              git -C packs-data show "$head:packs/manifest.json" > "$RUNNER_TEMP/head-catalog.json"
              node scripts/packs-pointer.mjs --commit "$head" --catalog "$RUNNER_TEMP/head-catalog.json"
            else
              node scripts/packs-pointer.mjs --commit "$DATA_COMMIT" --catalog packs-data/packs/manifest.json
            fi
            git add public/packs/data.json
          }
          # <<< point_data
          point_data
          if [ -d calibration/packs ]; then git add calibration/packs; fi
          if git diff --cached --quiet; then
            echo "No master changes."
            exit 0
          fi
          git commit -m "Presolve: ${NEW_FLOPS} new flops"
          hints=()
          for f in shards/*/summaries.json; do
            if [ -f "$f" ]; then hints+=(--summaries-from "$f"); fi
          done
          remote="origin/${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            # HEAD is detached at the run's commit, so push to the branch by name.
            if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push failed (attempt $attempt), rebasing onto the remote branch..."
            sleep $((attempt * 5))
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "$remote"; then
              # The commit only touches calibration/packs and public/packs/data.json. The calibration manifest is one
              # line of derived data, so any change of it on the branch conflicts with ours (e.g. "Re-run failed jobs"
              # after this run's merge already pushed): keep the branch's files (a version's files never change),
              # rebuild the calibration manifest with the branch's code and point data.json at packs-data's head (which
              # may be a later run's commit than this run's).
              conflicts=$(git diff --name-only --diff-filter=U)
              if [ -z "$conflicts" ] || grep -qvE '^(calibration/packs/|public/packs/data\.json$)' <<< "$conflicts"; then
                git rebase --abort
                echo "Rebase conflict outside calibration/packs and public/packs/data.json; not pushing."
                exit 1
              fi
              while IFS= read -r f; do
                if [ "$f" != calibration/packs/manifest.json ] && [ "$f" != public/packs/data.json ]; then
                  echo "::warning::$f differs from the branch's; keeping the branch's file"
                fi
                git checkout --ours -- "$f" # during a rebase, "ours" is the branch being rebased onto
              done <<< "$conflicts"
              if ! node scripts/presolve.mjs --rebuild-manifest --scenario "$SCENARIO" --set calibration "${hints[@]}"; then
                git rebase --abort
                echo "Manifest rebuild failed on top of the branch; not pushing."
                exit 1
              fi
              point_data
              if [ -d calibration/packs ]; then git add calibration/packs; fi
              if git diff --cached --quiet HEAD; then
                git rebase --skip # everything this run adds is already on the branch
              else
                GIT_EDITOR=true git rebase --continue
              fi
            fi
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse "$remote")" ]; then
              echo "Everything this run adds is already on the branch; nothing to push."
              exit 0
            fi
          done
          echo "Could not push after 4 attempts."
          exit 1

      # The schedule alone is not enough: GitHub sometimes never starts a scheduled run (on 2026-11-16 neither the
      # 11:23 nor the 17:23 one started), and a pack then waits another 6 hours or more. So while flops are left,
      # a run that pushed new flops starts the next one itself; with the concurrency group it begins as soon as
      # this run ends. A run that pushed nothing (no flop solved, e.g. only flops over --max-mb left) does not, so
      # this never loops without progress, and the schedule stays as the backstop. workflow_dispatch is one of the
      # two events GITHUB_TOKEN is allowed to trigger. The dry run counts the app's flops from packs-data's indexes.
      - name: Start the next run
        if: ${{ steps.commit.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHARDS: ${{ inputs.shards || '16' }}
          BUDGET: ${{ inputs.budget_minutes || '300' }}
          COUNT: ${{ inputs.count || '1755' }}
        run: |
          set_args=()
          if [ -n "$SET" ]; then set_args=(--set "$SET"); fi
          left=$(node scripts/presolve.mjs --dry-run --scenario "$SCENARIO" "${set_args[@]}" --count "$COUNT" | sed -n 's/^dry run: \([0-9][0-9]*\) flops planned.*/\1/p')
          if ! [[ "$left" =~ ^[0-9]+$ ]]; then
            echo "::warning::Could not count the flops left; the schedule will start the next run"
            exit 0
          fi
          if (( left == 0 )); then
            echo "Every pack has its first $COUNT flops; not starting another run."
            exit 0
          fi
          echo "$left flops left; starting the next run."
          gh workflow run presolve.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f scenario="$SCENARIO" -f shards="$SHARDS" -f budget_minutes="$BUDGET" -f count="$COUNT"
