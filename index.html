    <script>
      // Splash (src/splash): show on a cold start only. A reload in the same session (the PWA
      // update flow, a manual reload) skips it before it can paint. Mirrors splashDecision().
      (function () {
        var seen = false;
        try { seen = sessionStorage.getItem("pubaj.splash") === "1"; sessionStorage.setItem("pubaj.splash", "1"); } catch (e) {}
        try { var n = performance.getEntriesByType("navigation")[0]; if (n && n.type === "reload") seen = true; } catch (e) {}
        document.documentElement.setAttribute("data-splash", seen ? "skip" : "show");
      })();
    </script>
    <style>
      /* Launch splash (src/splash): pure CSS motion. Default styles are the settled frame (the logo
         exactly); animations only cover the intro. Timeline: src/splash/splash.ts.
         The logo is built from HTML boxes, each holding a small SVG: WebKit runs transform/opacity
         animations of HTML boxes on the compositor but animates SVG content on the main thread,
         which the app bundle keeps busy for the first few hundred ms. So every beat that must not
         stutter (pop, shades, brows, fan, snap marks, sheens) moves an HTML box; only garnish (the
         wink, the lens glint) animates inside an SVG. Every layer that shows at rest fills the logo box
         and draws with icon.svg's own viewBox (29 53 448 429) and transforms, so the settled frame
         renders exactly like the icon; the boxes animate only the change from it. Percentages are of
         the logo box, or of a card box (card units -150..150, -210..210) for the snap marks/sheens.
         The snap marks and sheens fill backwards (scaleX(0) / parked outside the card clip) so they
         are painted before their delay ends: an opacity:0 box may not be, and could then only
         appear once the main thread is free. */
      html{background:#090c11}
      #splash{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:#090c11;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;overflow:hidden;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;animation:spl-bail .25s ease-in 2.4s forwards}
      html[data-splash=skip] #splash{display:none}
      #splash.spl-out{animation:spl-out var(--spl-out,.25s) ease-in forwards}
      .spl-stage{display:flex;flex-direction:column;align-items:center;margin-bottom:5vh}
      .spl-out .spl-stage{animation:spl-zoom var(--spl-out,.25s) ease-in forwards}
      .spl-logo{position:relative;width:min(58vw,300px,40vh);aspect-ratio:448/429}
      .spl-logo::before{content:"";position:absolute;inset:-48% -52%;background:radial-gradient(closest-side,rgba(18,98,61,.62),rgba(15,81,50,.26) 52%,rgba(15,81,50,0));animation:spl-glow .6s cubic-bezier(.2,.7,.3,1) both}
      .spl-logo div,.spl-logo svg,.spl-logo i,.spl-logo b{position:absolute;display:block}
      .spl-logo svg{inset:0;width:100%;height:100%;overflow:visible}
      #splash svg *{transform-origin:0 0}
      .spl-pop,.spl-a,.spl-j,.spl-shades,.spl-brows{inset:0}
      .spl-pop{transform-origin:50.66964% 49.65035%;animation:spl-pop .2s cubic-bezier(.3,1.3,.5,1) backwards}
      .spl-a{transform-origin:39.50893% 50.11655%;animation:spl-fan-a .3s cubic-bezier(.22,1.5,.36,1) .58s backwards}
      .spl-j{transform-origin:64.0625% 47.78555%;animation:spl-fan-j .3s cubic-bezier(.22,1.5,.36,1) .58s backwards}
      .spl-shades{transform-origin:63.72053% 50.32654%;animation:spl-shades .48s linear .2s backwards}
      .spl-brows{animation:spl-brows .48s linear .2s backwards}
      .spl-card{width:57.58929%;height:84.1958%}
      .spl-a .spl-card{left:10.71429%;top:8.01865%;transform:rotate(-14deg)}
      .spl-j .spl-card{left:35.26786%;top:5.68765%;transform:rotate(8deg)}
      .spl-snap{height:2.14286%}
      .spl-snap b{inset:0;border-radius:99px;background:#fbbf24;opacity:0;transform-origin:0 50%;animation:spl-snap .3s cubic-bezier(.2,.7,.4,1) .65s backwards}
      .spl-j .spl-snap b{animation-delay:.67s}
      .spl-shine{inset:0;overflow:hidden;border-radius:8.66667%/6.19048%}
      .spl-shine i{left:-3.33333%;top:-11.90476%;width:23.33333%;height:123.80952%;transform-origin:228.57143% 50%;transform:skewX(-18deg);opacity:0;background:linear-gradient(90deg,rgba(255,215,106,0),rgba(255,215,106,.35) 38%,rgba(255,248,224,.9) 50%,rgba(255,215,106,.35) 62%,rgba(255,215,106,0));animation:spl-sheen .28s cubic-bezier(.45,0,.55,1) .74s backwards}
      .spl-j .spl-shine i{animation-delay:.78s}
      .spl-blink{animation:spl-blink .14s ease-in-out .33s both}
      .spl-wink{opacity:0;animation:spl-wink .14s step-end .33s}
      .spl-glint{opacity:0;animation:spl-glint .26s ease-out .84s}
      .spl-streak{opacity:0;animation:spl-streak .22s ease-out .86s}
      .spl-word{margin-top:clamp(16px,4.6vw,24px);display:flex;align-items:baseline;gap:.4em;font-size:clamp(32px,10vw,44px);font-weight:900;line-height:1;letter-spacing:-.015em;color:#fbbf24;animation:spl-rise .28s cubic-bezier(.2,.8,.3,1) .66s both}
      .spl-word small{font-size:max(15px,.38em);font-weight:800;letter-spacing:.02em;color:#f4f7fb;opacity:.86}
      .spl-tag{margin-top:10px;font-size:clamp(14px,3.9vw,16px);font-weight:600;letter-spacing:.03em;color:#a7b4c2;animation:spl-rise .28s cubic-bezier(.2,.8,.3,1) .72s both}
      @keyframes spl-bail{to{opacity:0;visibility:hidden;pointer-events:none}}
      /* No visibility:hidden here: a finger still down must keep hitting the splash, not the app. */
      @keyframes spl-out{to{opacity:0}}
      @keyframes spl-zoom{to{transform:scale(1.05)}}
      @keyframes spl-fade{from{opacity:0}}
      @keyframes spl-glow{from{opacity:0;transform:scale(.55)}}
      @keyframes spl-rise{from{opacity:0;transform:translateY(12px)}}
      @keyframes spl-pop{from{opacity:0;transform:translate(0,2.331%) scale(.84)}to{opacity:1;transform:translate(0,0) scale(1)}}
      @keyframes spl-shades{
        0%{transform:translate(0,0) rotate(0);animation-timing-function:cubic-bezier(.2,.9,.3,1.2)}
        24%{transform:translate(1.28238%,-9.52873%) rotate(-7deg)}
        62%{transform:translate(1.28238%,-9.52873%) rotate(-7deg);animation-timing-function:cubic-bezier(.6,0,.9,.6)}
        80%{transform:translate(-.04275%,.31762%) rotate(.5deg);animation-timing-function:ease-out}
        90%{transform:translate(.02992%,-.22234%) rotate(0)}
        100%{transform:translate(0,0) rotate(0)}}
      @keyframes spl-brows{0%,12%{transform:translate(0,0);animation-timing-function:cubic-bezier(.3,1.6,.5,1)}32%,62%{transform:translate(.38471%,-2.85862%);animation-timing-function:ease-in}74%,100%{transform:translate(0,0)}}
      @keyframes spl-blink{0%,100%{transform:scale(1,1)}30%,70%{transform:scale(1.1,.08)}}
      @keyframes spl-wink{30%{opacity:1}70%{opacity:0}}
      @keyframes spl-fan-a{from{transform:translate(10.04464%,.2331%) rotate(10deg)}to{transform:translate(0,0) rotate(0)}}
      @keyframes spl-fan-j{from{transform:translate(-12.5%,1.3986%) rotate(-5deg)}to{transform:translate(0,0) rotate(0)}}
      @keyframes spl-snap{0%{opacity:1;transform:translateX(0) scaleX(0)}35%{opacity:1;transform:translateX(0) scaleX(1)}100%{opacity:0;transform:translateX(60%) scaleX(.4)}}
      @keyframes spl-sheen{from{opacity:1;transform:translateX(-371.42857%) skewX(-18deg)}to{opacity:1;transform:translateX(742.85714%) skewX(-18deg)}}
      @keyframes spl-glint{0%{opacity:1;transform:scale(0) rotate(0)}40%{opacity:1;transform:scale(1.15) rotate(45deg)}100%{opacity:0;transform:scale(.2) rotate(90deg)}}
      @keyframes spl-streak{from{opacity:1;transform:translate(-30px,0)}to{opacity:1;transform:translate(30px,0)}}
      @media (prefers-reduced-motion:reduce){
        #splash *,#splash *::before{animation:none!important}
        #splash .spl-stage{animation:spl-fade .3s ease-out both!important}
      }
    </style>
