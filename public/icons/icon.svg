      <rect x="-104" y="-150" width="208" height="300" rx="10" fill="none" stroke="#fbbf24" stroke-width="6"/>
      <path transform="translate(-124 -136)" fill="#d6202f" d="M20.5 0.8L20.5 0.8Q11.9 0.8 7.3-2.9Q2.7-6.6 1.2-14.9L1.2-14.9L12.7-16.6Q13.4-12.3 15.3-10.3Q17.2-8.2 20.5-8.2L20.5-8.2Q24.0-8.2 25.8-10.5Q27.5-12.9 27.5-17.1L27.5-17.1L27.5-46.0L16.6-46.0L16.6-55.0L39.0-55.0L39.0-17.4Q39.0-8.8 34.1-4.0Q29.3 0.8 20.5 0.8Z"/>
      <use href="#heart" transform="translate(-105 -96) scale(0.5)" fill="#d6202f"/>
    </g>
  </g>
</svg>
